services:
  app:
    profiles: ["demo"]
    build: .
    container_name: itemsplit-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-local}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-itemsplit}
      DB_USER: ${DB_USER:-itemsplit}
      DB_PASSWORD: ${DB_PASSWORD:-itemsplit}
      DB_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-itemsplit}
      JWT_SECRET: ${JWT_SECRET:-change-me-to-a-long-random-secret}
      JWT_ACCESS_TOKEN_EXPIRATION: ${JWT_ACCESS_TOKEN_EXPIRATION:-86400000}
      LOCAL_STORAGE_ROOT: /app/storage
      RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-true}
      RATE_LIMIT_CAPACITY: ${RATE_LIMIT_CAPACITY:-120}
      RATE_LIMIT_WINDOW_SECONDS: ${RATE_LIMIT_WINDOW_SECONDS:-60}
    ports:
      - "${APP_PORT:-8080}:8080"
    volumes:
      - itemsplit-storage:/app/storage

  frontend:
    profiles: ["demo"]
    build:
      context: ./frontend
    container_name: itemsplit-frontend
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "${FRONTEND_PORT:-3000}:80"

  postgres:
    image: postgres:16-alpine
    container_name: itemsplit-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-itemsplit}
      POSTGRES_USER: ${DB_USER:-itemsplit}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-itemsplit}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - itemsplit-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-itemsplit} -d ${DB_NAME:-itemsplit}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  itemsplit-postgres-data:
  itemsplit-storage:
