server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  # Receipt images are limited to 10MB by the API; this leaves room for the multipart envelope.
  client_max_body_size 12m;
  index index.html;

  # Signed image URLs are bearer credentials. Keep them out of access/error logs.
  location /api/storage/local/ {
    access_log off;
    error_log /dev/null;
    proxy_pass http://app:8080/api/storage/local/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /api/ {
    proxy_pass http://app:8080/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
