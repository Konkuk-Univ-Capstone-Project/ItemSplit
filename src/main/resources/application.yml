spring:
  application:
    name: itemsplit
  profiles:
    default: local
  jpa:
    open-in-view: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

info:
  app:
    name: ${spring.application.name}

app:
  jwt:
    secret: ${JWT_SECRET:change-me-to-a-long-random-secret-for-itemsplit}
    access-token-expiration: ${JWT_ACCESS_TOKEN_EXPIRATION:86400000}
  storage:
    local:
      root-path: ${LOCAL_STORAGE_ROOT:./storage}
