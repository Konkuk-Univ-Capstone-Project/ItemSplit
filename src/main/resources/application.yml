spring:
  application:
    name: itemsplit
  profiles:
    default: local
  jackson:
    deserialization:
      accept-float-as-int: false
  servlet:
    multipart:
      # One receipt image per request, up to 10MB. nginx allows 12m to leave room for the multipart envelope.
      max-file-size: 10MB
      max-request-size: 11MB
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    # The consolidated V1 must run on an empty DB; never silently baseline an old schema.
    baseline-on-migrate: false

server:
  # Trust X-Forwarded-For/-Proto only from internal proxies (nginx, a load balancer in a private network).
  # Tomcat then uses the right-most address not added by those proxies as the client address.
  # Requests that reach the app directly keep their real connection address; their headers are ignored.
  forward-headers-strategy: native

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

info:
  app:
    name: ${spring.application.name}

app:
  settlement:
    snapshots:
      # Enable only after stage-2 edit protection is integrated.
      enabled: ${SETTLEMENT_SNAPSHOTS_ENABLED:false}
  ocr:
    max-attempts: 3
    limit:
      per-receipt-daily: ${OCR_PER_RECEIPT_DAILY_LIMIT:15}
      per-user-daily: ${OCR_PER_USER_DAILY_LIMIT:60}
  jwt:
    secret: ${JWT_SECRET:change-me-to-a-long-random-secret-for-itemsplit}
    access-token-expiration: ${JWT_ACCESS_TOKEN_EXPIRATION:86400000}
  storage:
    type: ${STORAGE_TYPE:local}   # local | s3
    cleanup-queue-path: ${STORAGE_CLEANUP_QUEUE:${app.storage.local.root-path}/.cleanup-pending}
    local:
      root-path: ${LOCAL_STORAGE_ROOT:./storage}
      signing-secret: ${LOCAL_STORAGE_SIGNING_SECRET:}
    s3:
      bucket: ${S3_BUCKET:}
      region: ${AWS_REGION:ap-northeast-2}
  rate-limit:
    enabled: ${RATE_LIMIT_ENABLED:true}
    capacity: ${RATE_LIMIT_CAPACITY:120}
    window-seconds: ${RATE_LIMIT_WINDOW_SECONDS:60}
