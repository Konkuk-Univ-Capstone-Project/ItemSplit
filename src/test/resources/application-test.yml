spring:
  datasource:
    url: jdbc:h2:mem:itemsplit;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop

app:
  rate-limit:
    enabled: false
  storage:
    local:
      root-path: ./build/test-storage
